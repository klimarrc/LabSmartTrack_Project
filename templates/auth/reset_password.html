{% extends "base.html" %}
{% block title %}
Reset Password | LabSmartTrack
{% endblock %}
{% block eyebrow %}
Account recovery
{% endblock %}
{% block page_title %}
Choose a new password
{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <form id="reset-password-form" method="POST" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>New password
      <input id="password" name="password" type="password" 
      minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <label>Confirm password
      <input id="confirm_password" name="confirm_password" type="password" 
      minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <p class="field-message" data-password-message aria-live="polite"></p>
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script
  src="{{ url_for('static', filename='js/auth/password_reset.js') }}"
  defer
></script>
{% endblock %}
